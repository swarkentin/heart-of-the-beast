name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Generate the lockfile in GitHub Actions so contributors (and automation
      # working through the GitHub API) do not need a local npm environment.
      - name: Generate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify committed lockfile is up to date
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git diff --exit-code -- package-lock.json
          else
            echo "::notice::package-lock.json is not committed yet; the generated lockfile will be uploaded as an artifact."
          fi

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 14

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript check and production build
        run: npm run build
