name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    name: Generate npm lockfile
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Lockfile generation does not run package lifecycle scripts. Keep this
      # write-enabled job separate from the build job, which executes project code.
      # Generate from the root npm workspace so every frontend dependency is locked centrally.
      - name: Generate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile to same-repository pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already up to date."
          else
            git commit -m "chore: update npm lockfile"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend workspace checks
    needs: lockfile
    if: always() && (github.event_name == 'push' || needs.lockfile.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Download generated lockfile
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: package-lock
          path: .

      - name: Verify committed lockfile is up to date
        if: github.event_name == 'push'
        run: git diff --exit-code -- package-lock.json

      - name: Verify generated lockfile matches committed file
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: git diff --exit-code -- package-lock.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check local development tooling syntax
        run: node --check scripts/dev.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript check and production build
        run: npm run build

  backend:
    name: Backend workspace checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod

      - name: Check formatting
        working-directory: backend
        run: |
          gofmt -d .
          gofmt -l .
          test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test -race ./...

      - name: Build
        working-directory: backend
        run: go build ./cmd/server
