name: Combat balance

on:
  pull_request:
    paths:
      - "backend/**"
      - "scripts/balance-pr-summary.py"
      - "scripts/balance-parallelism.patch"
      - ".github/workflows/balance.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "scripts/balance-pr-summary.py"
      - "scripts/balance-parallelism.patch"
      - ".github/workflows/balance.yml"
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: balance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    name: Seeded balance scenarios
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod

      - name: Prepare branch-point worktree
        if: github.event_name == 'pull_request'
        id: branch-point
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$BASE_SHA" "$HEAD_SHA"
          base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          git worktree add --detach /tmp/balance-branch-point "$base"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Apply simulation-only parallelism to branch point
        if: github.event_name == 'pull_request'
        run: |
          # Keep baseline simulations fast without depending on an ephemeral commit SHA.
          # Main may already contain this optimization; apply only when the branch point lacks it.
          if grep -q 'runtime.GOMAXPROCS(0)' /tmp/balance-branch-point/backend/internal/game/run_simulation.go \
            && grep -q 'sync.WaitGroup' /tmp/balance-branch-point/backend/internal/game/run_simulation.go; then
            echo "Branch point already has deterministic worker-pool parallelism."
          else
            git -C /tmp/balance-branch-point apply "$GITHUB_WORKSPACE/scripts/balance-parallelism.patch"
          fi
          git -C /tmp/balance-branch-point diff --check

      - name: Run branch-point simulations
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          cd /tmp/balance-branch-point/backend
          # Match the PR head's sample size; main/scheduled reports use the larger matrix.
          go run ./cmd/endless-balance -runs 60 -first-seed 1 -theme random \
            -json /tmp/branch-point-endless.json -markdown /tmp/branch-point-endless.md
          go run ./cmd/balance-report -seeds 30 -first-seed 1 \
            -json /tmp/branch-point-combat.json -markdown /tmp/branch-point-combat.md

      - name: Download latest accepted main-branch baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p backend/balance-baseline
          found=false
          run_ids="$(gh run list --workflow balance.yml --branch main --status success --limit 20 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)"
          for run_id in $run_ids; do
            rm -rf backend/balance-baseline/*
            if gh run download "$run_id" --name balance-baseline --dir backend/balance-baseline >/dev/null 2>&1 \
              && test -s backend/balance-baseline/balance-report.json; then
              echo "Using accepted main-branch balance baseline from workflow run $run_id."
              echo "BALANCE_BASELINE=balance-baseline/balance-report.json" >> "$GITHUB_ENV"
              found=true
              break
            fi
          done
          if [ "$found" != true ]; then
            echo "No successful main-branch run with a balance-baseline artifact was found; regression gating is skipped for this PR."
            echo "The branch-point comparison and absolute reports will still run."
          fi

      - name: Run endless expedition composition matrix
        working-directory: backend
        run: |
          set -o pipefail
          runs=100
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            runs=12
          fi
          go run ./cmd/endless-balance -runs "$runs" -first-seed 1 -theme random \
            -json endless-balance-report.json -markdown endless-balance-report.md \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run deterministic encounter regression suite
        working-directory: backend
        run: |
          set -o pipefail
          args=(-seeds 30 -first-seed 1 -json balance-report.json -markdown balance-report.md -endless-report endless-balance-report.json)
          if [ -n "${BALANCE_BASELINE:-}" ]; then
            args+=(-baseline "$BALANCE_BASELINE" -fail-on-regression)
          fi
          go run ./cmd/balance-report "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build PR regression dashboard
        if: github.event_name == 'pull_request'
        run: |
          python scripts/balance-pr-summary.py \
            --baseline-combat /tmp/branch-point-combat.json \
            --head-combat backend/balance-report.json \
            --baseline-endless /tmp/branch-point-endless.json \
            --head-endless backend/endless-balance-report.json \
            --base-sha "${{ steps.branch-point.outputs.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --output backend/balance-pr-summary.md
          cat backend/balance-pr-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PR balance reports
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: balance-report-pr
          path: |
            backend/balance-report.json
            backend/balance-report.md
            backend/endless-balance-report.json
            backend/endless-balance-report.md
            backend/balance-pr-summary.md
          if-no-files-found: error
          retention-days: 30

      - name: Update PR balance dashboard comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SUMMARY_PATH: backend/balance-pr-summary.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- balance-regression-dashboard -->';
            const body = fs.readFileSync(process.env.SUMMARY_PATH, 'utf8');
            if (!body.includes(marker)) throw new Error('Balance dashboard marker missing');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
              core.info(`Updated balance dashboard comment ${existing.id}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
              core.info(`Created balance dashboard comment ${created.data.id}`);
            }

      - name: Record accepted main balance baseline
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: balance-baseline
          path: |
            backend/balance-report.json
            backend/balance-report.md
            backend/endless-balance-report.json
            backend/endless-balance-report.md
          if-no-files-found: error
          retention-days: 90
