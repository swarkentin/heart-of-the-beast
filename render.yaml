# Render Blueprint for the production web app.
# Create the Neon database separately, then provide its pooled connection URL
# as DATABASE_URL when Render prompts during the first Blueprint sync.
services:
  - type: web
    name: heart-of-the-beast-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /readyz
    # maxShutdownDelaySeconds: 30 # Not supported on free tier
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      # Optional Discord sign-in (ADR 0034). Leave all three empty to stay
      # guest-only. DISCORD_REDIRECT_URI is the static site's
      # /auth/discord/callback page and must match the Discord app exactly.
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false

  - type: web
    name: heart-of-the-beast
    runtime: static
    buildCommand: npm ci && npm run build --workspace @heart-of-the-beast/frontend
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: checksPass
    routes:
      # Keep the browser on one origin; Render forwards API calls to the Go service.
      - type: rewrite
        source: /api/*
        destination: https://heart-of-the-beast-api.onrender.com/*
      # Vite's dev server handles the SPA fallback locally; configure it for production too.
      - type: rewrite
        source: /*
        destination: /index.html
